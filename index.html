<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知识喂了猫 · 导游证备考养成</title>
<meta name="theme-color" content="#EFF6EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知识喂了猫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐱</span>
      <h1 class="brand-title">知识喂了猫</h1>
    </div>

    <div class="topmeta">
      <div class="chip chip-dday" id="chip-dday" title="距离考试">
        <span class="chip-k">距考试</span><span class="chip-v">--</span>
      </div>
      <div class="chip" id="chip-phase" title="当前阶段">
        <span class="chip-k">阶段</span><span class="chip-v">--</span>
      </div>
      <div class="chip" id="chip-streak" title="连续打卡">
        <span class="chip-k">连续</span><span class="chip-v">--</span>
      </div>
      <button class="chip chip-checkin" id="chip-checkin" type="button" title="每日签到奖励">
        <span class="chip-k">🎁</span><span class="chip-v" id="chip-checkin-v">签到</span>
      </button>
      <button class="chip chip-save" id="chip-save" type="button" title="存档（每完成一项任务会自动存一份）">
        <span class="chip-k">💾</span><span class="chip-v" id="chip-save-v">存档 0</span>
      </button>
      <button class="chip chip-sync" id="chip-sync" type="button" title="把进度搬到别的设备 / 把别的设备的进度搬进来">
        <span class="chip-k">🔗</span><span class="chip-v">跨设备同步</span>
      </button>
      <button class="chip chip-music" id="music-chip" type="button" title="背景音乐：选曲 / 暂停">
        <span class="chip-k" id="music-ico">🎵</span><span class="chip-v" id="music-name">音乐关</span>
      </button>
    </div>

    <div class="wallet">
      <div class="cur cur-ticket" title="胶囊券：用来在扭蛋机抽胶囊">
        <span class="cur-ico">🎟️</span><span class="cur-num" id="cur-tickets">0</span>
        <span class="cur-name">胶囊券</span>
      </div>
      <div class="cur cur-bean" title="可可豆：用来买食物、药水与设施">
        <span class="cur-ico">🌰</span><span class="cur-num" id="cur-beans">0</span>
        <span class="cur-name">可可豆</span>
      </div>
      <div class="cur cur-freeq" title="免题券：每日签到抽到，可在刷题任务里抵 1 道题">
        <span class="cur-ico">🧾</span><span class="cur-num" id="cur-freeq">0</span>
        <span class="cur-name">免题券</span>
      </div>
      <div class="cur cur-level" title="照顾等级：照顾小生物获得经验，升级解锁更高级的照顾道具">
        <span class="cur-ico">🎖️</span><span class="cur-num" id="cur-level">Lv.1</span>
        <span class="cur-name" id="cur-exp">0/60</span>
      </div>
    </div>
    <div class="exp-bar-wrap" title="经验值进度"><i id="cur-exp-bar" style="width:0%"></i></div>
  </header>

  <!-- ============ 标签栏 ============ -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="garden">🌳 我的乐园<span class="dot" id="dot-garden"></span></button>
    <button class="tab" data-tab="study">🍽️ 今日投喂<span class="dot" id="dot-study"></span></button>
    <button class="tab" data-tab="gacha">🥚 扭蛋机<span class="dot" id="dot-gacha"></span></button>
    <button class="tab" data-tab="shop">🛒 可可豆商店</button>
    <button class="tab" data-tab="ach">🏆 成就</button>
    <button class="tab" data-tab="me">🙋 我的</button>
    <button class="tab" data-tab="help">❓ 怎么玩</button>
  </nav>

  <!-- ============ 主视图 ============ -->
  <main id="view"></main>

  <footer class="footer">
    <span>知识喂了猫 · 进度存在这台设备的浏览器里；换设备时点顶部「🔗 跨设备同步」搬过去。</span>
    <span id="foot-version"></span>
    <span id="foot-save">自动存档已开启</span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="fx-root" class="fx-root"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/qbank.js"></script>
<script src="js/game.js"></script>
<script src="js/study.js"></script>
<script src="js/app.js"></script>
<script>
/* PWA：注册 Service Worker（离线可玩 + 桌面图标入口） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
